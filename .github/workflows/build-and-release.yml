name: Build & Release CleanTV

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv-launcher:
    name: Build CleanTV TV Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv-${{ hashFiles('tv-launcher/**/*.gradle*', 'tv-launcher/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-tv-

      - name: Generate test keystore
        run: |
          keytool -genkeypair -v \
          -keystore cleantv-release4.jks \
          -alias testkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass testpass123 -keypass testpass123 \
          -dname "CN=Test, OU=Dev, O=Test, L=HN, C=VN"

      - name: Build release
        env:
         RELEASE_STORE_FILE: ${{ github.workspace }}/cleantv-release.jks
         RELEASE_STORE_PASSWORD: testpass123
         RELEASE_KEY_ALIAS: testkey
         RELEASE_KEY_PASSWORD: testpass123
        run: |
          cd tv-launcher
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload TV Launcher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleantv-launcher-apk
          path: tv-launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  release:
    name: Publish GitHub Release
    needs: [build-tv-launcher]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download TV Launcher APK
        uses: actions/download-artifact@v4
        with:
          name: cleantv-launcher-apk
          path: release-launcher

      - name: Download Mobile Companion APK
        uses: actions/download-artifact@v4
        with:
          name: cleantv-companion-apk
          path: release-companion

      - name: Prepare Release Assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v0.1"
          fi
          mkdir -p dist-release
          cp release-launcher/app-release.apk dist-release/cleantv-launcher-${TAG_NAME}.apk
          cp release-companion/app-release.apk dist-release/cleantv-companion-${TAG_NAME}.apk
          
          cd dist-release
          sha256sum *.apk > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.apk
            dist-release/sha256sums.txt
          generate_release_notes: true
          name: "CleanTV ${{ github.ref_name }}"
          draft: false
          prerelease: false
